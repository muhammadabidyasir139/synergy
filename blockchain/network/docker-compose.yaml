version: "3.8"

networks:
  synergy_net:
    name: synergy_net

volumes:
  orderer.synergy.com:
  peer0.investororg.synergy.com:
  peer0.umkmorg.synergy.com:

services:
  # ─── CouchDB instances (world state) ───────────────────────────────────────
  couchdb.investororg:
    container_name: couchdb.investororg
    image: couchdb:3.3.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    ports:
      - "5985:5984"
    networks:
      - synergy_net

  couchdb.umkmorg:
    container_name: couchdb.umkmorg
    image: couchdb:3.3.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    ports:
      - "5986:5984"
    networks:
      - synergy_net

  # ─── Orderer ────────────────────────────────────────────────────────────────
  orderer.synergy.com:
    container_name: orderer.synergy.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
    working_dir: /root
    volumes:
      - ./crypto-config/ordererOrganizations/synergy.com/orderers/orderer.synergy.com/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/synergy.com/orderers/orderer.synergy.com/tls:/var/hyperledger/orderer/tls
      - orderer.synergy.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
      - "9443:9443"
    networks:
      - synergy_net

  # ─── InvestorOrg Peer ────────────────────────────────────────────────────────
  peer0.investororg.synergy.com:
    container_name: peer0.investororg.synergy.com
    image: hyperledger/fabric-peer:2.5
    environment:
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: synergy_net
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_PROFILE_ENABLED: "false"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_PEER_ID: peer0.investororg.synergy.com
      CORE_PEER_ADDRESS: peer0.investororg.synergy.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.investororg.synergy.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.investororg.synergy.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.investororg.synergy.com:7051
      CORE_PEER_LOCALMSPID: InvestorOrgMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
      CORE_LEDGER_STATE_STATEDATABASE: CouchDB
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.investororg:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: admin
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/investororg.synergy.com/peers/peer0.investororg.synergy.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/investororg.synergy.com/peers/peer0.investororg.synergy.com/tls:/etc/hyperledger/fabric/tls
      - peer0.investororg.synergy.com:/var/hyperledger/production
    ports:
      - "7051:7051"
      - "9444:9444"
    depends_on:
      - couchdb.investororg
    networks:
      - synergy_net

  # ─── UmkmOrg Peer ────────────────────────────────────────────────────────────
  peer0.umkmorg.synergy.com:
    container_name: peer0.umkmorg.synergy.com
    image: hyperledger/fabric-peer:2.5
    environment:
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: synergy_net
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_PROFILE_ENABLED: "false"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_PEER_ID: peer0.umkmorg.synergy.com
      CORE_PEER_ADDRESS: peer0.umkmorg.synergy.com:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.umkmorg.synergy.com:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.umkmorg.synergy.com:9051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.umkmorg.synergy.com:9051
      CORE_PEER_LOCALMSPID: UmkmOrgMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9445
      CORE_LEDGER_STATE_STATEDATABASE: CouchDB
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.umkmorg:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: admin
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/umkmorg.synergy.com/peers/peer0.umkmorg.synergy.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/umkmorg.synergy.com/peers/peer0.umkmorg.synergy.com/tls:/etc/hyperledger/fabric/tls
      - peer0.umkmorg.synergy.com:/var/hyperledger/production
    ports:
      - "9051:9051"
      - "9445:9445"
    depends_on:
      - couchdb.umkmorg
    networks:
      - synergy_net

  # ─── Fabric CLI (admin operations) ──────────────────────────────────────────
  cli:
    container_name: cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      GOPATH: /opt/gopath
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_ID: cli
      CORE_PEER_ADDRESS: peer0.investororg.synergy.com:7051
      CORE_PEER_LOCALMSPID: InvestorOrgMSP
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/investororg.synergy.com/peers/peer0.investororg.synergy.com/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/investororg.synergy.com/peers/peer0.investororg.synergy.com/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/investororg.synergy.com/peers/peer0.investororg.synergy.com/tls/ca.crt
      CORE_PEER_MSPCONFIGPATH: /opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/investororg.synergy.com/users/Admin@investororg.synergy.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto
      - ./channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../chaincode:/opt/gopath/src/github.com/chaincode
      - ./scripts:/opt/gopath/src/github.com/hyperledger/fabric/peer/scripts
    networks:
      - synergy_net
    depends_on:
      - orderer.synergy.com
      - peer0.investororg.synergy.com
      - peer0.umkmorg.synergy.com
